[package]
name = "aily-desktop"
version = "0.1.0"
description = "AIly — Your AI Ally (Windows shell)"
authors = ["Alphaeus Ng"]
edition = "2021"
license = "MIT"

[lib]
name = "aily_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
