<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AIly — Your AI Ally</title>
    <meta name="description" content="AIly helps you achieve the targets you set. Local-first ally for your journey." />
    <meta name="theme-color" content="#0e1116" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AIly" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark"><span class="ai">AI</span><span class="ly">ly</span></div>
        <span class="tagline">Your AI Ally</span>
      </div>
      <div class="tray" id="tray-status">AIly · Ready</div>
    </header>

    <div class="layout">
      <nav class="side" aria-label="Primary">
        <button type="button" data-nav="today" class="active">Today</button>
        <button type="button" data-nav="targets">Targets</button>
        <button type="button" data-nav="review">Review</button>
        <button type="button" data-nav="usage">Usage</button>
        <button type="button" data-nav="blocks">Blocks</button>
        <button type="button" data-nav="setup">
          Setup <span id="setup-badge" class="badge">!</span>
        </button>
        <button type="button" data-nav="activity">Activity</button>
      </nav>
      <main>
        <section class="panel" data-panel="today" id="panel-today"></section>
        <section class="panel hidden" data-panel="targets" id="panel-targets"></section>
        <section class="panel hidden" data-panel="review" id="panel-review"></section>
        <section class="panel hidden" data-panel="usage" id="panel-usage"></section>
        <section class="panel hidden" data-panel="blocks" id="panel-blocks"></section>
        <section class="panel hidden" data-panel="setup" id="panel-setup"></section>
        <section class="panel hidden" data-panel="activity" id="panel-activity"></section>
      </main>
    </div>

    <footer class="footer">
      <span>AIly · local-first · MIT</span>
      <span id="brand-version">—</span>
    </footer>

    <div id="tutorial-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
      <div class="modal">
        <div class="modal-top">
          <span class="muted" id="tutorial-progress">0/8</span>
          <button type="button" data-action="close-tutorial" aria-label="Close">✕</button>
        </div>
        <h2 id="tutorial-title">Meet AIly</h2>
        <div id="tutorial-body"></div>
        <div class="modal-actions" id="tutorial-actions"></div>
      </div>
    </div>

    <script type="module" src="js/app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch((err) => {
            console.warn("AIly SW register failed", err);
          });
        });
      }
    </script>
  </body>
</html>
