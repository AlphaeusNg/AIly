<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e1116" />
    <title>AIly — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0e1116;
        color: #e6edf3;
        font-family: "Segoe UI", system-ui, sans-serif;
        text-align: center;
        padding: 1.5rem;
      }
      .card {
        max-width: 360px;
      }
      h1 {
        margin: 0.5rem 0;
        font-size: 1.4rem;
      }
      p {
        color: #8b9bb0;
        line-height: 1.45;
      }
      a {
        color: #6ea8fe;
      }
      .mark {
        font-weight: 800;
        font-size: 1.6rem;
        letter-spacing: -0.02em;
      }
      .ai {
        color: #6ea8fe;
      }
      .ly {
        color: #3dd6c6;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark"><span class="ai">AI</span><span class="ly">ly</span></div>
      <h1>You’re offline</h1>
      <p>
        AIly still works from the cached shell when installed. Open the app from your home screen, or reconnect and
        <a href="./index.html">return to AIly</a>.
      </p>
    </div>
  </body>
</html>
