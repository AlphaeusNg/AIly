name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: cargo test
        run: cargo test
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JS syntax
        run: node --check apps/web/js/*.js
      - name: capacity unit smoke
        run: node tools/test-capacity.mjs
      - name: shared capacity contract
        run: node tools/test-capacity-contract.mjs
      - name: persisted state tests
        run: node tools/test-store.mjs
