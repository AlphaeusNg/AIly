name: windows-installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "src-tauri/**"
      - "apps/web/**"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nsis:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Build NSIS installer
        run: npx --yes @tauri-apps/cli@2.11.4 build --bundles nsis --ci
      - name: Stage AIly-setup.exe
        shell: pwsh
        run: |
          $src = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $src) { throw "NSIS setup.exe not found" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $src.FullName "dist/AIly-setup.exe" -Force
          Get-Item "dist/AIly-setup.exe" | Format-List Name, Length, FullName
      - uses: actions/upload-artifact@v7
        with:
          name: AIly-setup
          path: dist/AIly-setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: nsis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: AIly-setup
          path: dist
      - name: Attach installer to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/AIly-setup.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
