name: packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - "src-tauri/**"
      - "android/**"
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - "tools/test-windows-installer.ps1"
      - "tools/verify-android-apk.sh"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: read

concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nsis:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Build NSIS installer
        run: npx --yes @tauri-apps/cli@2.11.4 build --bundles nsis --ci
      - name: Stage AIly-setup.exe
        shell: pwsh
        run: |
          $src = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $src) { throw "NSIS setup.exe not found" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $src.FullName "dist/AIly-setup.exe" -Force
          Get-Item "dist/AIly-setup.exe" | Format-List Name, Length, FullName
      - name: Test installed AIly
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          ./tools/test-windows-installer.ps1 `
            -InstallerPath "dist/AIly-setup.exe" `
            -ExpectedVersion $version
      - uses: actions/upload-artifact@v7
        with:
          name: AIly-setup
          path: dist/AIly-setup.exe
          if-no-files-found: error

  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Synchronize Android shell
        run: npx cap sync android
      - name: Test and build debug APK
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Stage and verify AIly-debug.apk
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/AIly-debug.apk
          version="$(node -p "require('./package.json').version")"
          bash tools/verify-android-apk.sh dist/AIly-debug.apk "$version"
      - uses: actions/upload-artifact@v7
        with:
          name: AIly-android-debug
          path: dist/AIly-debug.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [nsis, android-apk]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: AIly-setup
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: AIly-android-debug
          path: dist
      - name: Attach tested packages to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/AIly-setup.exe
            dist/AIly-debug.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
