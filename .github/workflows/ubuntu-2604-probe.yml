# TEMPORARY (2026-10-09): probe for actions/runner-images#14748 (ubuntu-latest -> 26.04 from 2026-10-19). Remove before merge.
name: ubuntu-26.04-probe

on:
  push:
    branches: [ci/ubuntu-26.04-probe]

permissions:
  contents: read

jobs:
  ci-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Print image identity
        run: |
          cat /etc/os-release
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Complete local gate
        run: npm test

  ci-android-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Print image identity
        run: |
          cat /etc/os-release
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Synchronize Android shell
        run: npx cap sync android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Android JVM tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

  packages-android-apk:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Print image identity
        run: |
          cat /etc/os-release
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Synchronize Android shell
        run: npx cap sync android
      - name: Test and build debug APK
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Stage and verify AIly-debug.apk
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/AIly-debug.apk
          version="$(node -p "require('./package.json').version")"
          bash tools/verify-android-apk.sh dist/AIly-debug.apk "$version"

  packages-release-tools:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Print image identity
        run: |
          cat /etc/os-release
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
      - name: Create dummy packages
        run: |
          mkdir -p dist
          printf 'Temporary installer checksum probe\n' > dist/AIly-setup.exe
          printf 'Temporary APK checksum probe\n' > dist/AIly-debug.apk
      - name: Generate and verify package checksums
        working-directory: dist
        run: sha256sum AIly-setup.exe AIly-debug.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt

  pages-stage:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Print image identity
        run: |
          cat /etc/os-release
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
      - name: Stage web app at site root
        run: |
          mkdir -p _site
          cp -a apps/web/. _site/
          # Ensure relative paths work at /AIly/ project pages
          # (GitHub project site base is /AIly/)
      - name: Verify staged web app
        run: |
          test -f _site/index.html && test -f _site/sw.js
          ls -la _site
